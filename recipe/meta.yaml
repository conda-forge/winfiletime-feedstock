{% set name = "winfiletime" %}
{% set version = "2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/winfiletime-{{ version }}.tar.gz
  sha256: 0fc30bd3ac05bff0894f9a07a4cf66247423203599bca276a9d53c450d0ceb29

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
  run:
    - python >={{ python_min }},<4.0.0

test:
  imports:
    - winfiletime
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jleclanche/winfiletime
  summary: Win32 Filetime / Datetime conversion functions
  license: CC0-1.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - n-elie
